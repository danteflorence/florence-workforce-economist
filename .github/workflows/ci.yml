# Florence Workforce Economist — CI
# Runs the full test suite (pricing engine, API, compliance guard, module
# imports, and the 22-view Streamlit smoke test) on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt pytest

      - name: Run test suite
        run: python -m pytest test_pricing_engine.py tests/ -q
