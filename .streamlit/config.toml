# Florence brand theme — matches the customer-facing deck language
# (Newsreader serif headlines, Inter body, teal/navy palette)

[theme]
# Primary action color — Florence editorial teal (#0ABAB5 corrects the legacy #0BC5A0)
primaryColor = "#0ABAB5"

# Page background — clean white
backgroundColor = "#FFFFFF"

# Secondary background — warm off-white for cards / containers
secondaryBackgroundColor = "#FAFBFB"

# Body text — editorial ink
textColor = "#101828"

# Editorial serif headings (CSS loads GT Sectra / Playfair Display + Inter body + JetBrains Mono)
font = "serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false
