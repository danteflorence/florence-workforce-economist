# Render.com production deployment manifest.
#
# Three Streamlit apps + one scheduled cron for surveillance feeds.
# After authorizing Florence's Render account, link this repo and Render
# will spin up everything automatically on push.

services:
  # ─── Internal Florence Workforce Economist (sales + ops) ──────────
  # Docker image (see Dockerfile) so a persistent disk can preserve mutable
  # runtime state — auth users/sessions, CRM overrides, mail log, activations,
  # activity log — across redeploys. The entrypoint reseeds read-only reference
  # data on boot, so deploys still update the universe while state persists.
  - type: web
    name: florence-economist
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # a persistent disk requires a paid plan
    region: oregon           # change to virginia / frankfurt / singapore if closer
    autoDeploy: true
    healthCheckPath: /_stcore/health   # Streamlit health endpoint (200 when up)
    disk:
      name: florence-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # FlorenceRN Core SSO — staff sign in once at id.florenceeducation.com and
      # the shared fl_session cookie authorizes pricing.florenceeducation.com too;
      # core_auth.py verifies it against Core's JWKS. These values MUST match the
      # platform render.yaml `florence-shared` group. (Deploy Core first; until
      # it's reachable, set FLORENCE_INTERNAL_AUTH=0 to run the app open.)
      - key: FLORENCE_INTERNAL_AUTH
        value: "1"
      - key: CORE_ISSUER_URL
        value: https://id.florenceeducation.com
      - key: CORE_JWKS_URL
        value: https://id.florenceeducation.com/.well-known/jwks.json
      - key: PUBLIC_CORE_URL
        value: https://id.florenceeducation.com
      - key: PUBLIC_PRICING_URL
        value: https://pricing.florenceeducation.com
      - key: TOKEN_ISS
        value: florence-auth
      - key: TOKEN_AUD
        value: florence
      - key: COOKIE_SECURE
        value: "1"
      # Secrets — set real values in the Render dashboard (sync:false keeps them out of git):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BLS_REGISTRATION_KEY
        sync: false
      # Error monitoring (error_monitoring.py) — optional; empty = local errors.log only
      - key: SENTRY_DSN
        sync: false
      # Offsite backups (ops_backup.py, run daily by docker-entrypoint.sh).
      # Local rotating snapshots always run; set these for offsite S3/R2/B2:
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # ─── Pricing API (FastAPI) — the shared pricing brain for a React product ─
  # Pure pricing_engine.price(): no data files, no secrets. The future
  # customer-facing React app calls this instead of re-implementing pricing.
  - type: web
    name: florence-pricing-api
    runtime: python
    plan: starter            # 'free' is fine for dev (it sleeps between calls)
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn pricing_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SENTRY_DSN
        sync: false   # optional error monitoring; empty = local errors.log only

  # ─── Customer pricing calculator (React/Vite static site) ─────────
  # Calls florence-pricing-api. Set VITE_API_URL (build-time) to that service's
  # URL in the dashboard. SPA rewrite so client routing works. See web/ + DEPLOY.md.
  - type: web
    name: florence-pricing-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://florence-pricing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── Public Customer Calculator (lead funnel) ─────────────────────
  - type: web
    name: florence-calculator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run customer_calculator.py --server.port $PORT --server.headless true --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Stripe Payment Link URLs (set in dashboard):
      # - key: STRIPE_SUBSCRIPTION_URL
      # - key: STRIPE_PLACEMENT_URL

  # ─── Public Market Intelligence (educational) ─────────────────────
  - type: web
    name: florence-market-intel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run public_market_intel.py --server.port $PORT --server.headless true --server.enableCORS false

  # ─── Nurse Portal (login-gated) ───────────────────────────────────
  - type: web
    name: florence-nurses
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run nurse_portal.py --server.port $PORT --server.headless true --server.enableCORS false

  # ─── Surveillance Cron (monthly briefing refresh) ─────────────────
  - type: cron
    name: florence-surveillance-monthly
    runtime: python
    plan: starter
    schedule: "5 0 5 * *"   # 00:05 UTC on the 5th of each month
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python -m surveillance.jolts_healthcare && \
      python -m surveillance.ces_rn && \
      python -m surveillance.cms_care_compare && \
      python -m surveillance.ownership_changes && \
      python -m surveillance.pricing_alerts && \
      python -m surveillance.forecast && \
      python -m surveillance.briefing

  # ─── News Surveillance Cron (daily) ───────────────────────────────
  - type: cron
    name: florence-surveillance-daily
    runtime: python
    plan: starter
    schedule: "0 6 * * *"   # 06:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python -m surveillance.news_feeds
